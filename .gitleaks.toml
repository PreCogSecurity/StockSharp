# Gitleaks configuration for StockSharp
# https://github.com/gitleaks/gitleaks

title = "StockSharp Gitleaks Config"

[allowlist]
description = "Allowlisted patterns for StockSharp"
# Allow test/demo credentials in sample code
paths = [
  "*.sample",
  "*.example",
  "*.template",
  "*.md",
  "Documentation/**",
  "Samples/**",
  "Anywhere/**",
  "Studio/**",
  "*.xaml",
  "*.xaml.cs"
]

# Allow specific patterns that are known false positives
[[allowlist]]
description = "Allow demo credentials in sample applications"
regexes = [
  '''(?i)(demo|test|sample|example|placeholder)["\']?\s*[:=]\s*["\'][^"\']+["\']'''
]

[[allowlist]]
description = "Allow QUIK demo credentials in Anywhere sample"
paths = ["Anywhere/**"]
regexes = ['''(?i)quik["\']?\s*[:=]\s*["\']quik["\']''']

[[allowlist]]
description = "Allow version numbers and assembly info"
regexes = [
  '''\d+\.\d+\.\d+(\.\d+)?''',
  '''AssemblyVersion\("[\d.]+\)''',
  '''FileVersion\("[\d.]+\)'''
]

# Rules specific to StockSharp
[rules]
# Generic API key patterns
[[rules]]
id = "generic-api-key"
description = "Generic API key pattern"
regex = '''(?i)(api[_-]?key|apikey)\s*[:=]\s*["\'][a-zA-Z0-9_\-]{20,}["\']'''
tags = ["key", "api"]
entropy = 3.0

[[rules]]
id = "generic-secret"
description = "Generic secret pattern"
regex = '''(?i)(secret|password|passwd|pwd)\s*[:=]\s*["\'][^"\']{8,}["\']'''
tags = ["secret", "password"]
entropy = 2.5

[[rules]]
id = "connection-string"
description = "Database connection string"
regex = '''(?i)(connectionstring|connstr)\s*[:=]\s*["\'][^"\']*[;=][^"\']*["\']'''
tags = ["database", "connection"]

[[rules]]
id = "jwt-token"
description = "JWT token"
regex = '''eyJ[A-Za-z0-9_-]+\.eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'''
tags = ["jwt", "token"]

[[rules]]
id = "private-key"
description = "Private key"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*["\'][A-Za-z0-9/+=]{40}["\']'''
tags = ["aws", "secret"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''gh[pousr]_[A-Za-z0-9_]{36,251}'''
tags = ["github", "token"]

[[rules]]
id = "slack-token"
description = "Slack API Token"
regex = '''xox[baprs]-[A-Za-z0-9-]{10,}'''
tags = ["slack", "token"]

# StockSharp specific patterns
[[rules]]
id = "stocksharp-license"
description = "StockSharp license key"
regex = '''(?i)license[_-]?key\s*[:=]\s*["\'][A-Z0-9\-]{20,}["\']'''
tags = ["license", "stocksharp"]

[[rules]]
id = "quik-credentials"
description = "QUIK connector credentials"
regex = '''(?i)quik\s*[:=]\s*["\'][^"\']+["\']'''
tags = ["quik", "connector"]